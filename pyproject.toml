[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaccine_tcell_model"
version = "0.1.0"
description = "Modular Python package for vaccine dose -> DC -> pMHC -> T-cell -> Tfh modeling, reproducing Bhagchandani et al. 2024 (Science Immunology) and Mayer et al. 2019 (PNAS), plus an integrated extension."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
